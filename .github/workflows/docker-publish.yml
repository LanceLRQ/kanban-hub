# Docker Hub 发布 workflow。
#
# 触发方式：仅 `v*.*.*` 格式的 tag push。特意不挂任何 branches / pull_request 触发——
# 发布之前 main / dev 的日常推送零 CI 消耗；secrets 还没配置时，workflow 也不会因
# push 而跑到登录那一步失败。apps/web/src/ci-workflow.test.ts 会守护这条约定，
# 往这里加分支触发会让测试变红。
#
# 所需 secrets（仓库 Settings → Secrets and variables → Actions → New repository secret）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub Access Token（Docker Hub → Account Settings →
#                       Personal access tokens 生成，权限 Read & Write）
# 版本唯一来源：packages/core/package.json 的 version 字段——tag 必须等于
# `v` + 该版本号，不一致直接失败（verify job 第一步校验）。

name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  IMAGE_NAME: lancelrq/kanban-hub

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck 部署脚本
        run: shellcheck deploy/kanban-hub.sh deploy/tests/*.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 校验 tag 与 packages/core 的 version 一致
        run: |
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 packages/core 的 version ${PKG_VERSION} 不一致"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # next-env.d.ts 与 .next/types 不入库，CI 全新 checkout 没有这两样，typecheck 会报
      # LayoutProps 等 Next 生成类型找不到；先跑 next typegen 补出来，typecheck 才能过
      - run: pnpm -F @kanban-hub/web exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:deploy

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 计算镜像 tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "list<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            # 预发布版本（版本号含 -）不占用 latest；正式版额外打 latest
            if [[ "$VERSION" != *-* ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Dockerfile 的 deps/build 阶段在目标平台执行 pnpm install、next build，runtime
      # 还有 apt-get RUN；amd64 runner 上构建 linux/arm64 需要 QEMU 模拟，漏了首跑必红
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
          # scope 固定（默认按 ref 派生，每个新 tag 都会冷缓存），跨 tag 复用构建缓存
          cache-from: type=gha,scope=kanban-hub-build
          cache-to: type=gha,mode=max,scope=kanban-hub-build
