# kanban-hub 生产部署。可变项都在同目录的 .env 里（从 .env.example 复制）。
# 首次启动前先在本目录执行：mkdir -p data backups
# 原因：宿主机上不存在的挂载目录会被 Docker 以 root 身份创建，容器以 PUID 运行后就写不进去。
services:
  kanban-hub:
    image: kanban-hub:${KH_IMAGE_TAG:-local}
    build:
      context: ..
      target: runtime
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: kanban-hub
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${KH_BIND:-0.0.0.0}:${KH_PORT:-28970}:28970"
    volumes:
      - ./data:/data
      - ./backups:/backups
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - UMASK=${UMASK:-022}
      - KH_ADMIN_PASSWORD=${KH_ADMIN_PASSWORD:?请在 .env 设置 KH_ADMIN_PASSWORD}
      - KH_PUBLIC_URL=${KH_PUBLIC_URL:-}
      - KH_STALE_DAYS=${KH_STALE_DAYS:-7}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:28970/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
